name = "ask-sja-topping"
main = "src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
DEEPSEEK_MODEL = "deepseek-flash"
EVENTS_URL = "https://hilltoppers.pages.dev/events.json"
DAY_TYPE_URL = "https://hilltoppers.pages.dev/day_type.json"

[[ratelimits]]
name = "QUESTION_LIMITER"
namespace_id = "3401"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "3402"
simple = { limit = 60, period = 60 }

# Set DEEPSEEK_API_KEY with `npx wrangler secret put DEEPSEEK_API_KEY`.
# This project has its own deployment, assets and secret; it does not use
# the extension's auth, storage, or existing schedule-admin Worker.
