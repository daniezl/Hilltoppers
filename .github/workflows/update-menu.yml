name: Update menu and events

# Derived data with no hand-written parts, so it is regenerated and pushed
# directly. Schedule overrides go through update-sja-calendar.yml instead,
# which opens a PR.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: data

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: node scripts/fetch_menu.mjs

      # A calendar hiccup should not hold up the menu. The daily
      # update-sja-calendar.yml run is the one that fails loudly on feed trouble.
      - run: node scripts/fetch_sja_events.mjs
        continue-on-error: true

      - name: Commit & push if changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public/menu.json
          git diff --staged --quiet || git commit -m "chore: update menu.json"
          git add data/public/events.json
          git diff --staged --quiet || git commit -m "chore: update events.json"
          git push
