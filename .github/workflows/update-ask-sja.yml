name: Update Ask SJA sources

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - toppings/ask-sja/corpus_sources.json
      - toppings/ask-sja/scripts/**
      - .github/workflows/update-ask-sja.yml

permissions:
  contents: write

concurrency:
  group: ask-sja-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: toppings/ask-sja
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: toppings/ask-sja/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run refresh:corpus
      - name: Publish changed documents through the existing data site
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toppings/ask-sja/corpus/bulletins.json toppings/ask-sja/corpus/newsletters.json toppings/ask-sja/public/corpus.json data/public/ask-sja-corpus.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update Ask SJA sources"
          # Other data jobs also push to main; include their changes before retrying.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
