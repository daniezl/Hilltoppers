name: Sync SJA calendar

# Opens a pull request rather than pushing, because special_days.json is
# hand-curated and the bot's classification is deliberately conservative.
# A failing run is the alarm that the calendar feed or the parser broke.

on:
  schedule:
    - cron: "0 11 * * *" # ~6-7am in St. Johnsbury, before the school day
  push:
    branches: [main]
    paths:
      - data/public/special_days.json
      - data/public/special_periods.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sja-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync calendar into schedule overrides
        id: sync
        working-directory: data
        env:
          SJA_ISSUES_FILE: ${{ runner.temp }}/sja-schedule-issues.json
          SJA_REPORT_FILE: ${{ runner.temp }}/sja-calendar-report.md
        run: node scripts/fetch_sja_calendar.mjs

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/sja-calendar-sync
          delete-branch: true
          title: "chore: sync special days from SJA calendar"
          body-path: ${{ runner.temp }}/sja-calendar-report.md
          commit-message: "chore: sync special days from SJA calendar"
          add-paths: |
            data/public/special_days.json
            data/public/special_periods.json

      - name: Track schedule reviews in issues
        uses: actions/github-script@v7
        env:
          SJA_ISSUES_FILE: ${{ runner.temp }}/sja-schedule-issues.json
        with:
          script: |
            const fs = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { syncScheduleIssues } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/data/scripts/sync_schedule_issues.mjs`).href);
            const report = JSON.parse(await fs.readFile(process.env.SJA_ISSUES_FILE, 'utf8'));
            await syncScheduleIssues({ github, context, report });
