name = "schedule-admin-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 本地开发端口配置
[dev]
port = 8787

# 生产环境配置
[env.production]
vars = { ENVIRONMENT = "production" }

# KV Namespace 配置
# 使用命令创建: npx wrangler kv namespace create SCHEDULE_KV
# 然后将输出的 id 填入下面
# 开发环境和生产环境使用同一个 KV namespace
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "0dc72530532c41f3b79647f91bac9766"
preview_id = "0dc72530532c41f3b79647f91bac9766"

# Ideas board 投票存储
# 创建: npx wrangler d1 create hilltoppers-ideas
# 建表: npx wrangler d1 execute hilltoppers-ideas --file=schema.sql --remote
[[d1_databases]]
binding = "IDEAS_DB"
database_name = "hilltoppers-ideas"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# 想法板对应的仓库
GITHUB_REPO = "daniezl/Hilltoppers"
# Firebase 项目 ID，用于校验 ID token 的 iss/aud（不是密钥）
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"

# 环境变量说明：
# - EDITORS: 编辑器邮箱列表（逗号分隔），通过 wrangler secret put EDITORS 设置
# - ADMINS: 管理员邮箱列表（逗号分隔），通过 wrangler secret put ADMINS 设置
# - CLOUDFLARE_ACCESS_AUD: (可选) Cloudflare Access audience tag，用于 JWT 验证
# - GITHUB_TOKEN: fine-grained PAT，只需 Hilltoppers 仓库的 Issues 读写权限
#                 通过 npx wrangler secret put GITHUB_TOKEN 设置
#
# 设置环境变量：
# 方式 1 (推荐): npx wrangler secret put EDITORS
# 方式 2: 在 Cloudflare Dashboard → Workers → Settings → Variables 中设置

